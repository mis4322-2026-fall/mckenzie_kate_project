{% extends "base.html" %}
{% block title %}Log in | Movie Finder{% endblock %}
{% block content %}
<h1>Log in</h1>
<p>Use your Movie Finder username and password.</p>
<form method="post" class="account-form">
  {% csrf_token %}
  {{ form.as_p }}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button type="submit">Log in</button>
</form>
{% endblock %}
