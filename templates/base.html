{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Movie Finder{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'movies/style.css' %}">
</head>
<body>
<header>
  <a class="brand" href="{% url 'welcome' %}">Movie Finder</a>
  <nav aria-label="Main navigation">
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
    {% else %}<a href="{% url 'login' %}">Log in</a>{% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
